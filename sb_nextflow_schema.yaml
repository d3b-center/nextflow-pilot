app_content:
    entrypoint: main.nf
class: nextflow
cwlVersion: None
inputs:
-   id: input_bam_list
    inputBinding:
        shellQuote: false
        itemSeparator: ','
        prefix: --input_bam_list
    type: File[]?
-   id: input_pe_reads_list
    inputBinding:
        shellQuote: false
        itemSeparator: ','
        prefix: --input_pe_reads_list
    type: File[]?
-   id: input_pe_mates_list
    inputBinding:
        shellQuote: false
        itemSeparator: ','
        prefix: --input_pe_mates_list
    type: File[]?
-   id: input_pe_rgs_list
    inputBinding:
        shellQuote: false
        itemSeparator: ','
        prefix: --input_pe_rgs_list
    type: string[]?
-   id: input_se_reads_list
    inputBinding:
        shellQuote: false
        itemSeparator: ','
        prefix: --input_se_reads_list
    type: File[]?
-   id: input_se_rgs_list
    inputBinding:
        shellQuote: false
        itemSeparator: ','
        prefix: --input_se_rgs_list
    type: string[]?
-   id: reference_tar
    inputBinding:
        prefix: --reference_tar
    type: File
    sbg:suggestedValue: {class: File, path: 5f4ffff4e4b0370371c05153, name: Homo_sapiens_assembly38.tgz}
-   id: cram_reference
    inputBinding:
        prefix: --cram_reference
    type: File?
-   id: biospecimen_name
    inputBinding:
        prefix: --biospecimen_name
    type: string?
-   id: output_basename
    inputBinding:
        prefix: --output_basename
    type: string
-   id: dbsnp_vcf
    inputBinding:
        prefix: --dbsnp_vcf
    type: File?
    sbg:suggestedValue: {class: File, path: 6063901f357c3a53540ca84b, name: Homo_sapiens_assembly38.dbsnp138.vcf}
-   id: dbsnp_idx
    inputBinding:
        prefix: --dbsnp_idx
    type: File?
    sbg:suggestedValue: {class: File, path: 6063901e357c3a53540ca834, name: Homo_sapiens_assembly38.dbsnp138.vcf.idx}
-   id: knownsites
    inputBinding:
        shellQuote: false
        itemSeparator: ','
        prefix: --knownsites
    type: File[]
    sbg:suggestedValue:
    - {class: File, path: 6063901e357c3a53540ca835, name: 1000G_omni2.5.hg38.vcf.gz}
    - {class: File, path: 6063901c357c3a53540ca80f, name: 1000G_phase1.snps.high_confidence.hg38.vcf.gz}
    - {class: File, path: 60639017357c3a53540ca7d0, name: Homo_sapiens_assembly38.known_indels.vcf.gz}
    - {class: File, path: 6063901a357c3a53540ca7f3, name: Mills_and_1000G_gold_standard.indels.hg38.vcf.gz}
-   id: knownsites_indexes
    inputBinding:
        shellQuote: false
        itemSeparator: ','
        prefix: --knownsites_indexes
    type: File[]?
    sbg:suggestedValue:
    - {class: File, path: 60639016357c3a53540ca7b1, name: 1000G_omni2.5.hg38.vcf.gz.tbi}
    - {class: File, path: 6063901e357c3a53540ca845, name: 1000G_phase1.snps.high_confidence.hg38.vcf.gz.tbi}
    - {class: File, path: 6063901c357c3a53540ca80d, name: Homo_sapiens_assembly38.known_indels.vcf.gz.tbi}
    - {class: File, path: 6063901c357c3a53540ca806, name: Mills_and_1000G_gold_standard.indels.hg38.vcf.gz.tbi}
-   id: contamination_sites_bed
    inputBinding:
        prefix: --contamination_sites_bed
    type: File?
    sbg:suggestedValue: {class: File, path: 6063901e357c3a53540ca833, name: Homo_sapiens_assembly38.contam.bed}
-   id: contamination_sites_mu
    inputBinding:
        prefix: --contamination_sites_mu
    type: File?
    sbg:suggestedValue: {class: File, path: 60639017357c3a53540ca7cd, name: Homo_sapiens_assembly38.contam.mu}
-   id: contamination_sites_ud
    inputBinding:
        prefix: --contamination_sites_ud
    type: File?
    sbg:suggestedValue: {class: File, path: 6063901f357c3a53540ca84f, name: Homo_sapiens_assembly38.contam.UD}
-   id: wgs_calling_interval_list
    inputBinding:
        prefix: --wgs_calling_interval_list
    type: File?
    sbg:suggestedValue: { class: File, path: 60639018357c3a53540ca7df, name: wgs_calling_regions.hg38.interval_list}
-   id: wgs_coverage_interval_list
    inputBinding:
        prefix: --wgs_coverage_interval_list
    type: File?
    sbg:suggestedValue: {class: File, path: 6063901c357c3a53540ca813, name: wgs_coverage_regions.hg38.interval_list}
-   id: wgs_evaluation_interval_list
    inputBinding:
        prefix: --wgs_evaluation_interval_list
    type: File?
    sbg:suggestedValue: {class: File, path: 60639017357c3a53540ca7d3, name: wgs_evaluation_regions.hg38.interval_list}
-   id: wxs_bait_interval_list
    inputBinding:
        prefix: --wxs_bait_interval_list
    type: File?
-   id: wxs_target_interval_list
    inputBinding:
        prefix: --wxs_target_interval_list
    type: File?
-   id: cutadapt_r1_adapter
    inputBinding:
        prefix: --cutadapt_r1_adapter
    type: string?
-   id: cutadapt_r2_adapter
    inputBinding:
        prefix: --cutadapt_r2_adapter
    type: string?
-   id: cutadapt_min_len
    inputBinding:
        prefix: --cutadapt_min_len
    type: int?
-   id: cutadapt_quality_base
    inputBinding:
        prefix: --cutadapt_quality_base
    type: int?
-   id: cutadapt_quality_cutoff
    inputBinding:
        prefix: --cutadapt_quality_cutoff
    type: string?
-   id: min_alignment_score
    inputBinding:
        prefix: --min_alignment_score
    type: int?
-   id: precalculated_contamination
    inputBinding:
        prefix: --precalculated_contamination
    type: float?
-   id: wgs_or_wxs
    inputBinding:
        prefix: --wgs_or_wxs
    type:
    - 'null'
    - name: wgs_or_wxs
      symbols:
      - WGS
      - WXS
      type: enum
-   id: test_aws
    inputBinding:
        prefix: --test_aws
    type: boolean?
-   id: test_batch
    inputBinding:
        prefix: --test_batch
    type: boolean?
-   id: test_cavatica
    inputBinding:
        prefix: --test_cavatica
    type: boolean?
    default: true
-   id: outdir
    inputBinding:
        prefix: --outdir
    label: Path to the output directory where the results will be saved.
    sbg:category: Input/output options
    sbg:icon: fas fa-folder-open
    sbg:toolDefaultValue: ./results
    type: string
-   doc: Use to set an upper-limit for the CPU requirement for each process. Should
        be an integer e.g. `--max_cpus 1`
    id: max_cpus
    inputBinding:
        prefix: --max_cpus
    label: Maximum number of CPUs that can be requested for any single job.
    sbg:category: Max job request options
    sbg:hidden: true
    sbg:icon: fas fa-microchip
    sbg:toolDefaultValue: 16
    type:
    - 'null'
    - int
-   doc: Use to set an upper-limit for the memory requirement for each process. Should
        be a string in the format integer-unit e.g. `--max_memory '8.GB'`
    id: max_memory
    inputBinding:
        prefix: --max_memory
    label: Maximum amount of memory that can be requested for any single job.
    sbg:category: Max job request options
    sbg:hidden: true
    sbg:icon: fas fa-memory
    sbg:pattern: ^\d+(\.\d+)?\.?\s*(K|M|G|T)?B$
    sbg:toolDefaultValue: 128.GB
    type:
    - 'null'
    - string
-   doc: Use to set an upper-limit for the time requirement for each process. Should
        be a string in the format integer-unit e.g. `--max_time '2.h'`
    id: max_time
    inputBinding:
        prefix: --max_time
    label: Maximum amount of time that can be requested for any single job.
    sbg:category: Max job request options
    sbg:hidden: true
    sbg:icon: far fa-clock
    sbg:pattern: ^(\d+\.?\s*(s|m|h|day)\s*)+$
    sbg:toolDefaultValue: 240.h
    type:
    - 'null'
    - string
-   doc: List of files not added as explicit workflow inputs but required for workflow
        execution.
    id: auxiliary_files
    label: Auxiliary files
    type:
    - 'null'
    -   items: File
        type: array
-   doc: Provide parameters through a JSON format input file.
    id: params_file
    inputBinding:
        prefix: -params-file
    label: Params files
    sbg:fileTypes: JSON
    type:
    - 'null'
    - File
outputs:
-   id: alignment_metrics
    outputBinding:
      glob: '**/metrics/*.alignment_summary_metrics'
    type: File?
-   id: artifact_bait_bias_detail_metrics
    outputBinding:
      glob: '**/metrics/*.artifact_metrics.bait_bias_detail_metrics'
    type: File?
-   id: artifact_bait_bias_summary_metrics
    outputBinding:
      glob: '**/metrics/*.artifact_metrics.bait_bias_summary_metrics'
    type: File?
-   id: artifact_error_summary_metrics
    outputBinding:
      glob: '**/metrics/*.artifact_metrics.error_summary_metrics'
    type: File?
-   id: artifact_pre_adapter_detail_metrics
    outputBinding:
      glob: '**/metrics/*.artifact_metrics.pre_adapter_detail_metrics'
    type: File?
-   id: artifact_pre_adapter_summary_metrics
    outputBinding:
      glob: '**/metrics/*.artifact_metrics.pre_adapter_summary_metrics'
    type: File?
-   id: bqsr_report
    outputBinding:
      glob: '**/metrics/*.GatherBqsrReports.recal_data.csv'
    type: File
-   id: cram
    outputBinding:
      glob: '**/*.cram'
    secondaryFiles:
    - pattern: .crai
      required: true
    type: File
-   id: cutadapt_stats
    outputBinding:
      glob: '**/metrics/*cutadapt_stats.txt'
    type: File[]?
-   id: gc_bias_chart
    outputBinding:
      glob: '**/metrics/*.gc_bias_metrics.pdf'
    type: File?
-   id: gc_bias_detail
    outputBinding:
      glob: '**/metrics/*.gc_bias_metrics.txt'
    type: File?
-   id: gc_bias_summary
    outputBinding:
      glob: '**/metrics/*.gc_bias_summary_metrics.txt'
    type: File?
-   id: gvcf
    outputBinding:
      glob: '**/*.g.vcf.gz'
    secondaryFiles:
    - pattern: .tbi
      required: true
    type: File?
-   id: gvcf_calling_metrics
    outputBinding:
      glob: '**/metrics/*.variant_calling_*_metrics'
    type: File[]?
-   id: hs_metrics
    outputBinding:
      glob: '**/metrics/*.hs_metrics'
    type: File?
-   id: idxstats
    outputBinding:
      glob: '**/metrics/*.idxstats.txt'
    type: File?
-   id: insert_metrics
    outputBinding:
      glob: '**/metrics/*.insert_size_metrics'
    type: File?
-   id: insert_plot
    outputBinding:
      glob: '**/metrics/*.insert_size_Histogram.pdf'
    type: File?
-   id: qual_chart
    outputBinding:
      glob: '**/metrics/*.qual_score_dist.pdf'
    type: File?
-   id: qual_metrics
    outputBinding:
      glob: '**/metrics/*.qual_score_dist.txt'
    type: File?
-   id: verifybamid_output
    outputBinding:
      glob: '**/metrics/*.selfSM'
    type: File?
-   id: wgs_metrics
    outputBinding:
      glob: '**/metrics/*.wgs_metrics'
    type: File?
-   id: xy_ratio
    outputBinding:
      glob: '**/metrics/*.ratio.txt'
    type: File
-   id: execution_report
    outputBinding:
      glob: '**/pipeline_info/execution_report_*'
    type: File
-   id: execution_timeline
    outputBinding:
      glob: '**/pipeline_info/execution_timeline_*'
    type: File
requirements:
-   class: InlineJavascriptRequirement
hints:
-   class: sbg:NextflowExecutionMode
    value: multi-instance
